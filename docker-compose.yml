services:
  app:
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: runtime
    container_name: bps_app
    working_dir: /var/www/html
    # Jalan sebagai user host supaya file di folder yang di-mount tidak jadi milik root.
    user: "${DOCKER_UID:-1000}:${DOCKER_GID:-1000}"
    environment:
      # UID host tidak punya entri di /etc/passwd container, jadi HOME diarahkan
      # ke folder yang bisa ditulis — kalau tidak, cache composer gagal dibuat.
      HOME: /tmp
    volumes:
      - .:/var/www/html
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    container_name: bps_nginx
    # Port sengaja tidak dibuka di sini. Local memakainya lewat
    # docker-compose.override.yml, server lewat docker-compose.prod.yml.
    volumes:
      - .:/var/www/html
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    restart: unless-stopped

  # Bukan service yang jalan terus. Dipanggil manual saat aset perlu dibangun:
  #   docker compose --profile tools run --rm assets
  assets:
    image: node:22-alpine
    working_dir: /var/www/html
    user: "${DOCKER_UID:-1000}:${DOCKER_GID:-1000}"
    environment:
      HOME: /tmp
    volumes:
      - .:/var/www/html
    profiles: [tools]
    command: sh -c "npm ci && npm run build"
